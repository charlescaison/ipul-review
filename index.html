<script>
(function () {
  var lang = null;
  try { lang = window.localStorage.getItem('ipul-lang'); } catch (e) {}
  if (lang !== 'en' && lang !== 'es') {
    lang = null;
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < prefs.length && !lang; i++) {
      var p = String(prefs[i]).toLowerCase();
      if (p.indexOf('es') === 0) lang = 'es';
      else if (p.indexOf('en') === 0) lang = 'en';
    }
  }
  window.location.replace((lang || 'es') + '/');
})();
</script>
